unbind C-b
set -g prefix `
bind-key ` last-window
bind-key e send-prefix

set -g default-terminal "screen-256color"
set -g status-position bottom
set -g status-bg colour234
set -g status-fg colour137
set -g status-left ''
set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20
setw -g mode-keys vi

setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

# Number windows and panes from 1 (matches the keyboard layout) and close gaps when a window closes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set-option -g history-limit 5000
setw -g mouse on
set -g set-clipboard on
# Used by every copy-pipe without an explicit command (double/triple click, y in copy mode)
set -g copy-command 'xclip -selection clipboard -in'

